<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Half-space blow-up at a regular free-boundary point</title><desc id="desc">Illustrative normalized half-space blow-up with normal nu equals (0,1), alpha equals beta equals one and Q of x0 equals one. The state profiles u0 and v0 both equal the positive part of s. Left: positivity half-space above s equals zero. Right: zero for s at most zero, linear ramp for s positive.</desc>
<rect width="900" height="600" fill="#FBFAF7"/>
