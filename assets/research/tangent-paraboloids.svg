<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="tp-title tp-desc">
  <title id="tp-title">Schematic distance profile for a tangent paraboloid</title>
  <desc id="tp-desc">A scalar distance profile, not a picture of a Heisenberg surface or a set of points. The horizontal variable is r equals d of p and q. The vertical variable is d of p inverse q to the base subgroup V. For the illustrative normalization alpha equals one half and c equals lambda equals one, a dashed copper linear bound is r and a forest-green boundary is r to the power three halves, with the nonnegative region below it shaded. Both meet at zero and at r equals one. The power bound becomes proportionally thinner near zero: its ratio to r is the square root of r, which is one, one half, and one quarter when r is one, one quarter, and one sixteenth. No containment of all points of a measurable set is asserted.</desc>
  <rect width="1000" height="560" fill="#f8f8f3"/>
  <text x="60" y="48" fill="#163d30" font-family="Georgia, 'Times New Roman', serif" font-size="34">Schematic distance profile · α = 1/2</text>
